<style>
:root{
  --primary:#7A2232;--on-primary:#F6EFDF;--primary-container:#EED5D1;--on-primary-container:#4A1220;
  --bg:#E8DCC2;--surface:#F6EFDF;--sunken:#DFD1B3;--ink:#1E1912;--muted:#5A4E3C;--outline:#857455;--border:#C9B994;
  --fd:'Frank Ruhl Libre',Georgia,'Times New Roman',serif;--fb:Assistant,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r:6px;--gut:clamp(20px,5vw,48px);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#E7A3A6;--on-primary:#3A0E17;--primary-container:#5E1826;--on-primary-container:#F6D9DA;
  --bg:#1E1912;--surface:#2A231A;--sunken:#231D15;--ink:#F2E8D3;--muted:#C9B99A;--outline:#8E7E62;--border:#4A3F30;color-scheme:dark}}
:root[data-theme="dark"]{--primary:#E7A3A6;--on-primary:#3A0E17;--primary-container:#5E1826;--on-primary-container:#F6D9DA;
  --bg:#1E1912;--surface:#2A231A;--sunken:#231D15;--ink:#F2E8D3;--muted:#C9B99A;--outline:#8E7E62;--border:#4A3F30;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--fb)}
a{color:var(--primary)}a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:700;line-height:1.1}
p{margin:0}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.nav{display:flex;align-items:center;gap:20px;min-height:68px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:900 22px var(--fd);margin-inline-end:auto}
.nav a.l{color:var(--ink);text-decoration:none;font-weight:600;font-size:16px}
.nav a.l:hover{color:var(--primary)}
.lang{display:flex;border:1px solid var(--outline);border-radius:var(--r);overflow:hidden}
.lang button{min-width:44px;min-height:40px;border:0;background:transparent;color:var(--muted);font:600 15px var(--fb);cursor:pointer}
.lang button+button{border-inline-start:1px solid var(--outline)}
.lang button[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
@media (max-width:640px){.nav a.l{display:none}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding-inline:24px;border-radius:var(--r);font:600 17px var(--fb);text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-outline{border-color:var(--outline);color:var(--primary);background:transparent}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center;padding-block:clamp(48px,8vw,104px)}
@media (max-width:880px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(46px,7.5vw,88px);letter-spacing:-.02em;font-weight:900}
.hero .sub{font-size:clamp(19px,2.2vw,22px);color:var(--muted);max-width:34ch;margin-top:20px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.trust{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:24px;color:var(--muted);font-size:15px}
.trust span{display:inline-flex;align-items:center;gap:8px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* the signature: the shield as a page from a sefer */
.sheet{background:var(--surface);border-radius:8px;padding:28px;box-shadow:0 0 0 1px rgb(30 25 18 / .12);max-width:380px;justify-self:center;width:100%}
.sheet .app{color:var(--muted);font-weight:600;font-size:15px;text-align:center}
.sheet .q{font:700 32px/1.15 var(--fd);text-align:center;margin-top:8px}
.verse{border-block:1px solid var(--border);padding-block:22px;margin-block:22px;display:grid;gap:12px}
.verse .he{font:500 30px/1.7 var(--fd);direction:rtl;text-align:right}
.verse .tr{font-size:17px}
.verse .ref{font-weight:600;font-size:14px;color:var(--primary)}
.sheet .btn{width:100%}
.sheet .skip{display:block;text-align:center;margin-top:10px;color:var(--primary);font-weight:600}
/* sections */
section{padding-block:clamp(56px,8vw,96px)}
section+section{border-top:1px solid var(--border)}
.eyebrow{color:var(--muted);font-weight:600;font-size:16px;margin-bottom:12px}
h2{font-size:clamp(32px,4.5vw,48px);max-width:22ch}
.lead{font-size:20px;color:var(--muted);max-width:60ch;margin-top:16px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:48px;counter-reset:s}
@media (max-width:800px){.steps{grid-template-columns:1fr}}
.steps li{list-style:none;border-top:2px solid var(--primary);padding-top:20px}
.steps li::before{counter-increment:s;content:counter(s);font:700 44px/1 var(--fd);color:var(--primary);display:block;margin-bottom:12px}
.steps h3,.feat h3{font:700 22px/1.3 var(--fb)}
.steps p,.feat p{color:var(--muted);margin-top:8px}
.steps,.feats{padding:0}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:40px;border-top:1px solid var(--border)}
@media (max-width:720px){.feats{grid-template-columns:1fr}}
.feat{list-style:none;padding:28px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:auto 1fr;gap:16px}
.feats .feat:nth-child(odd){padding-inline-end:32px}
.feat .ico{width:28px;height:28px;color:var(--primary);margin-top:2px}
.evidence{display:grid;grid-template-columns:auto 1fr;gap:12px 32px;align-items:baseline;margin-top:40px}
.evidence .n{font:900 clamp(64px,10vw,120px)/1 var(--fd);color:var(--primary)}
.evidence p{max-width:46ch;font-size:19px}
.evidence small{grid-column:1/-1;color:var(--muted);font-size:14px}
@media (max-width:600px){.evidence{grid-template-columns:1fr}}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:40px;max-width:880px}
@media (max-width:720px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border-radius:8px;padding:28px;display:grid;gap:14px;align-content:start}
.plan.pro{background:var(--primary-container);color:var(--on-primary-container)}
.plan .price{font:700 40px/1 var(--fd)}
.plan .per{font-size:16px;color:inherit;opacity:.85}
.plan ul{margin:0;padding:0;display:grid;gap:10px}
.plan li{list-style:none;display:flex;gap:10px;align-items:flex-start}
.plan li .ico{margin-top:4px}
details{border-bottom:1px solid var(--border);padding-block:6px}
details:first-of-type{border-top:1px solid var(--border);margin-top:32px}
summary{cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;font:600 19px var(--fb);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 28px var(--fb);color:var(--primary)}
details[open] summary::after{content:"−"}
details p{color:var(--muted);padding-bottom:18px;max-width:70ch}
.final{text-align:center}
.final h2{margin-inline:auto}
.final .ctas{justify-content:center}
.wait{margin-top:24px;display:none;gap:10px;flex-wrap:wrap;justify-content:center}
.wait.on{display:flex}
.wait input{min-height:52px;min-width:260px;padding-inline:14px;border:1px solid var(--outline);border-radius:var(--r);background:var(--surface);color:var(--ink);font:400 17px var(--fb)}
.msg{margin-top:12px;color:var(--muted);min-height:1.6em}
footer{border-top:1px solid var(--border);padding-block:32px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between}
</style>
</head>

let lang = 'es';
try { const s = localStorage.getItem('tb-lang'); if (s && T[s]) lang = s; else { const n = (navigator.language||'es').slice(0,2); if (T[n]) lang = n; } } catch (e) {}
const CHECK = '<svg class="ico" aria-hidden="true"><use href="#i-check"/></svg>';
function render(){
  const d = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = d[el.dataset.i] ?? ''; });
  document.querySelectorAll('[data-i-aria]').forEach(el => el.setAttribute('aria-label', d[el.dataset.iAria]));
  document.querySelectorAll('[data-i-ph]').forEach(el => el.setAttribute('placeholder', d[el.dataset.iPh]));
  document.querySelectorAll('[data-list]').forEach(ul => { ul.innerHTML = ''; d[ul.dataset.list].forEach(t => { const li = document.createElement('li'); li.innerHTML = CHECK; const s = document.createElement('span'); s.textContent = t; li.appendChild(s); ul.appendChild(li); }); });
  const fl = document.getElementById('faqList'); fl.innerHTML = '';
  d.faq.forEach(([q,a]) => { const det = document.createElement('details'); const sm = document.createElement('summary'); sm.textContent = q; const p = document.createElement('p'); p.textContent = a; det.append(sm, p); fl.appendChild(det); });
  document.querySelector('.verse .tr').hidden = !d['shield.tr'];
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.title = `Torah Break · ${d['hero.title']}`;
}
document.querySelectorAll('[data-href="demo"]').forEach(a => a.href = DEMO_URL);
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('tb-lang', lang); } catch (e) {} render(); }));
render();

/* Lista de espera: se guarda en la base del artifact cuando el visitante puede escribir (miembros invitados). */
(async () => {
  if (!window.claude) return;
  const db = await window.claude.use('db'); const user = await window.claude.use('user');
  if (!db || !user) return;
  const form = document.getElementById('wait'); const msg = document.getElementById('msg');
  form.classList.add('on');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = T[lang]['wait.err']; return; }
    try {
      const id = await user.id();
      await db.collection('waitlist').doc(id).set({ email, lang, at: new Date().toISOString() });
      msg.textContent = T[lang]['wait.ok']; form.reset();
    } catch (err) { msg.textContent = T[lang]['wait.fail']; }
  });
})();
